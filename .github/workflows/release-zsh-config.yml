name: Release Zsh Config

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=v$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT
          fi

      - name: Create build directory
        run: mkdir -p build/.zsh

      - name: Clone plugins
        run: |
          git clone --depth 1 https://github.com/joel-porquet/zsh-dircolors-solarized.git build/.zsh/zsh-dircolors-solarized
          git clone --depth 1 https://github.com/zsh-users/zsh-autosuggestions.git build/.zsh/zsh-autosuggestions
          git clone --depth 1 https://github.com/zsh-users/zsh-syntax-highlighting.git build/.zsh/zsh-syntax-highlighting
          git clone --depth 1 https://github.com/zsh-users/zsh-completions.git build/.zsh/zsh-completions
          git clone --depth 1 https://github.com/zsh-users/zsh-history-substring-search.git build/.zsh/zsh-history-substring-search

      - name: Remove .git directories
        run: find build/.zsh -name ".git" -type d -exec rm -rf {} +

      - name: Set permissions
        run: |
          # 确保目录权限为 755，文件权限为 644
          # 这是安全权限：非 group/world writable
          find build/.zsh -type d -exec chmod 755 {} \;
          find build/.zsh -type f -exec chmod 644 {} \;

      - name: Copy config files
        run: |
          cp configs/.zshrc build/.zshrc
          cp configs/.dircolors build/.dircolors
          cp configs/install.sh build/install.sh
          chmod 644 build/.zshrc build/.dircolors
          chmod 755 build/install.sh

      - name: Set build directory safe permissions
        run: |
          # 关键：确保 build 目录本身权限为 755
          # 避免打包时将不安全权限带入 tarball
          chmod 755 build

      - name: Create tarball
        run: |
          cd build
          # 重要：不要使用 '.' 打包，而是明确列出文件和目录
          # 这样解压时不会改变目标目录(~)的权限
          tar -czf ../zsh-config-${{ steps.version.outputs.version }}.tar.gz \
            .zsh \
            .zshrc \
            .dircolors \
            install.sh
          cd ..
          sha256sum zsh-config-${{ steps.version.outputs.version }}.tar.gz > zsh-config-${{ steps.version.outputs.version }}.tar.gz.sha256

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Zsh Config ${{ steps.version.outputs.version }}
          body: |
            ## Zsh 配置文件打包
            
            ### 版本信息
            - 版本：${{ steps.version.outputs.version }}
            
            ### 包含内容
            - zsh-dircolors-solarized
            - zsh-autosuggestions
            - zsh-syntax-highlighting
            - zsh-completions
            - zsh-history-substring-search
            - .zshrc 配置文件
            - .dircolors 颜色配置
            - install.sh 安装脚本
            
            ### 安装（推荐方式）
            ```bash
            # 1. 安装 zsh
            apt install zsh    # Debian/Ubuntu
            # 或 apk add zsh   # Alpine
            
            # 2. 下载最新版本
            wget https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/zsh-config-${{ steps.version.outputs.version }}.tar.gz
            
            # 3. 解压到临时目录（不要直接解压到 ~/ ）
            mkdir -p /tmp/zsh-config
            tar -xzf zsh-config-${{ steps.version.outputs.version }}.tar.gz -C /tmp/zsh-config
            
            # 4. 运行安装脚本（自动修复权限、备份旧配置、保护SSH）
            /tmp/zsh-config/install.sh
            
            # 5. 使配置生效
            source ~/.zshrc
            ```
            
            ### Alpine Linux
            ```bash
            apk add --no-cache zsh coreutils
            wget https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/zsh-config-${{ steps.version.outputs.version }}.tar.gz
            mkdir -p /tmp/zsh-config
            tar -xzf zsh-config-${{ steps.version.outputs.version }}.tar.gz -C /tmp/zsh-config
            /tmp/zsh-config/install.sh
            # install.sh 会提示是否切换 shell，或手动执行:
            chsh -s /bin/zsh
            ```
            
            ### 校验
            ```bash
            sha256sum -c zsh-config-${{ steps.version.outputs.version }}.tar.gz.sha256
            ```
            
            ### ⚠️ 安全提醒
            如果你已关闭 SSH 密码登录（仅使用密钥），请务必：
            1. **保持当前 SSH 连接不要断开**
            2. 另开一个终端测试 SSH 登录
            3. 确认成功后再关闭原连接
          files: |
            zsh-config-${{ steps.version.outputs.version }}.tar.gz
            zsh-config-${{ steps.version.outputs.version }}.tar.gz.sha256
          draft: false
          prerelease: false
